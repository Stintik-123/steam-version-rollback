[plugin]
id = "com.versionrollback.steam"
name = "Version Rollback"
version = "0.3.2"
author = "Stintik-123"
description = "Качай и откатывай версии игры: ветки/Manifest'ы, загрузка депо самой Steam, подмена файлов. Сбор метаданных о версиях с этого ПК — только по вашему согласию и только вручную: наружу уходят лишь пары depotid → GID, без аккаунта и без ключей депо."

[assets]
resources = ["resources/**/*"]

[backend]
entry = "backend/main.lua"
# main.lua — сборка из backend/lib/*.lua + boot.lua (tools/bundle-backend.mjs):
# в упакованном .star require соседних файлов не работает.
sources = ["backend/main.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
# auto = собрать и положить плагин в папку установки Millennium
output_path = "auto"

[dev]
auto_restart = true
# при правках .lua и .tsx перезагружаем UI Steam автоматически
reload_steamui_when = "both"

[inspect]
depth = 4
colors = true
show_hidden = true

[logger]
padding = 0
backend_prefix = "VRB-BCK"
frontend_prefix = "VRB-FRT"

[patches]
# true = Millennium логирует, какие патчи применились (нужно для отладки)
debug = true


